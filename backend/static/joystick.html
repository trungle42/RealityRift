<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Storybound joystick</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; --gold: #f2d68b; --ink: #0f1f1a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(circle at 50% 40%, #1d3a2e, var(--ink) 70%); color: #f7edd0; font-family: Georgia, 'Times New Roman', serif; overscroll-behavior: none; }
  #pad { position: fixed; inset: 0; touch-action: none; }
  header { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; }
  h1 { margin: 0; font-size: 18px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  #status { margin-top: 6px; font-size: 13px; opacity: 0.8; }
  #status.ok::before, #status.bad::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: #7ee2a8; vertical-align: middle; }
  #status.bad::before { background: #ff8b78; }
  .hint { position: fixed; bottom: max(26px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 13px; opacity: 0.6; pointer-events: none; transition: opacity 250ms; }
  .base, .knob { position: fixed; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); }
  .base { width: 168px; height: 168px; border: 2px solid #f2d68b88; background: #f2d68b14; box-shadow: 0 0 40px #f2d68b22 inset; }
  .base.sprint { border-color: #9be8ff; box-shadow: 0 0 36px #9be8ff55 inset; }
  .knob { width: 74px; height: 74px; background: radial-gradient(circle at 35% 30%, #fff1c4, #d7ab55 70%); box-shadow: 0 4px 18px #0008; }
  .idle { opacity: 0.35; }
  .btn { position: fixed; top: max(64px, calc(env(safe-area-inset-top) + 52px)); z-index: 2; touch-action: manipulation; padding: 12px 18px; border-radius: 999px; font: 600 15px Georgia, serif; letter-spacing: 0.06em; color: var(--ink); border: 0; box-shadow: 0 4px 16px #0007; }
  .btn:active { transform: scale(0.94); }
  #scan { right: 16px; background: linear-gradient(#f6e2a6, #d7ab55); }
  #roll { left: 16px; background: #cfe3dc; }
  #slash { top: auto; right: 18px; bottom: max(64px, calc(env(safe-area-inset-bottom) + 50px)); width: 112px; height: 112px; padding: 0; border-radius: 50%; font-size: 19px; color: #fff4dc; background: radial-gradient(circle at 35% 30%, #ff9a7a, #b8322a 72%); box-shadow: 0 6px 22px #0009, 0 0 0 3px #f2d68b66; }
  #who { margin-top: 4px; font-size: 15px; color: #fff4dc; min-height: 1.2em; }
  #who i { font-style: normal; display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 7px; vertical-align: -1px; box-shadow: 0 0 0 2px #0006; }
  #tap { position: fixed; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 3px solid var(--gold); opacity: 0; pointer-events: none; transform: scale(0.6); transition: opacity 260ms, transform 260ms; }
  #tap.on { opacity: 0.9; transform: scale(1); transition: none; }
</style>
</head>
<body>
<div id="pad"></div>
<header><h1>Storybound</h1><div id="who"></div><div id="status" class="bad">connecting…</div></header>
<div class="base idle" id="base"></div><div class="knob idle" id="knob"></div><div id="tap"></div>
<button class="btn" id="roll" type="button">Roll</button><button class="btn" id="scan" type="button">✦ Scan</button><button class="btn" id="slash" type="button">⚔ Slash</button>
<div class="hint" id="hint">Drag to move · push past the ring to sprint · tap to talk, start and choose · Slash strikes · Scan opens or closes the rift</div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  // Player slots come from the relay; the wand colours, in player order, from the game's ?wand= (carried in the QR link).
  const MAX = 3, PIP = 2, DOT = { red: '#e8463a', blue: '#4b8df0', yellow: '#f2c935' };
  const wands = (params.get('wand') || '').toLowerCase().split(',').filter((c) => c in DOT);
  const who = document.getElementById('who');
  let full = false;
  function showPlayer(n) {
    const colour = wands[n];
    who.replaceChildren();
    if (colour) { const dot = document.createElement('i'); dot.style.background = DOT[colour]; who.append(dot); }
    who.append(`Player ${n + 1}${colour ? ' · ' + colour : ''}${n === PIP ? ' (Pip the fairy)' : ''}`);
  }
  const room = (params.get('room') || 'storybound').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 32) || 'storybound';
  const RADIUS = 80, SPRINT = 1.35;
  const pad = document.getElementById('pad'), base = document.getElementById('base'), knob = document.getElementById('knob');
  const statusEl = document.getElementById('status'), hint = document.getElementById('hint');
  let ws, retry = 0, touchId = null, origin = { x: innerWidth / 2, y: innerHeight * 0.68 };
  let vec = { x: 0, y: 0, sprint: false };

  function place(el, x, y) { el.style.left = x + 'px'; el.style.top = y + 'px'; }
  function rest() { place(base, origin.x, origin.y); place(knob, origin.x, origin.y); base.classList.add('idle'); knob.classList.add('idle'); base.classList.remove('sprint'); }
  rest();
  addEventListener('resize', () => { if (touchId === null) { origin = { x: innerWidth / 2, y: innerHeight * 0.68 }; rest(); } });

  function setStatus(ok, text) { statusEl.className = ok ? 'ok' : 'bad'; statusEl.textContent = text; }
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws/joystick/${room}?role=phone`);
    ws.onopen = () => { retry = 0; full = false; setStatus(true, 'connected · room ' + room); };
    // A full room (MAX players) keeps trying slowly, so this phone gets in when someone leaves.
    ws.onclose = () => {
      if (full) { setStatus(false, `room full (${MAX} players) · waiting for a free spot`); who.textContent = ''; setTimeout(connect, 5000); return; }
      setStatus(false, 'reconnecting…'); setTimeout(connect, Math.min(3000, 400 + retry++ * 400));
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (event) => {
      let m; try { m = JSON.parse(event.data); } catch { return; }
      if (m.type === 'peer' && m.role === 'game') setStatus(true, m.state === 'joined' ? 'game connected' : 'waiting for the game');
      else if (m.type === 'slot' && Number.isInteger(m.player)) showPlayer(m.player);
      else if (m.type === 'full') full = true;
    };
  }
  connect();

  function send() { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'move', x: +vec.x.toFixed(3), y: +vec.y.toFixed(3), sprint: vec.sprint })); }
  // A quick tap without a drag is the game's action button (E / Enter); Scan and Roll are their own buttons.
  const TAP_MS = 300, TAP_PX = 14, tapRing = document.getElementById('tap');
  let downAt = 0, travel = 0;
  function command(type) {
    if (!ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ type }));
    if (navigator.vibrate) navigator.vibrate(type === 'action' ? 12 : type === 'slash' ? 40 : 25);
  }
  function tapped(x, y) {
    command('action');
    tapRing.style.left = x + 'px'; tapRing.style.top = y + 'px'; tapRing.classList.add('on');
    requestAnimationFrame(() => requestAnimationFrame(() => tapRing.classList.remove('on')));
  }
  for (const [id, type] of [['scan', 'scan'], ['roll', 'roll'], ['slash', 'slash']]) {
    document.getElementById(id).addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); command(type); });
  }
  // Resend ~30 times a second while held so the game never mistakes a steady thumb for a lost signal.
  setInterval(() => { if (touchId !== null) send(); }, 33);

  function update(touch) {
    let dx = touch.clientX - origin.x, dy = touch.clientY - origin.y;
    const dist = Math.hypot(dx, dy), clamped = Math.min(dist, RADIUS);
    const nx = dist ? dx / dist : 0, ny = dist ? dy / dist : 0;
    place(knob, origin.x + nx * clamped, origin.y + ny * clamped);
    const mag = Math.min(1, dist / RADIUS);
    vec = { x: nx * mag, y: -ny * mag, sprint: dist / RADIUS > SPRINT };   // y: up on the stick = forward
    base.classList.toggle('sprint', vec.sprint);
  }

  pad.addEventListener('pointerdown', (e) => {
    if (touchId !== null) return;
    touchId = e.pointerId; try { pad.setPointerCapture(e.pointerId); } catch { /* synthetic or already-released pointer */ }
    origin = { x: e.clientX, y: e.clientY };          // floating stick: wherever the thumb lands
    place(base, origin.x, origin.y); base.classList.remove('idle'); knob.classList.remove('idle'); hint.style.opacity = 0;
    downAt = performance.now(); travel = 0;
    update(e); send();
  });
  pad.addEventListener('pointermove', (e) => { if (e.pointerId === touchId) { travel = Math.max(travel, Math.hypot(e.clientX - origin.x, e.clientY - origin.y)); update(e); } });
  function release(e) {
    if (e.pointerId !== touchId) return;
    if (e.type === 'pointerup' && performance.now() - downAt < TAP_MS && travel < TAP_PX) tapped(origin.x, origin.y);
    touchId = null; vec = { x: 0, y: 0, sprint: false }; send(); send();
    origin = { x: innerWidth / 2, y: innerHeight * 0.68 }; rest();
  }
  pad.addEventListener('pointerup', release); pad.addEventListener('pointercancel', release);
  pad.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  // Never leave the hero running if the page is hidden mid-drag.
  document.addEventListener('visibilitychange', () => { if (document.hidden && touchId !== null) { touchId = null; vec = { x: 0, y: 0, sprint: false }; send(); rest(); } });
  // Keep the screen awake while playing: a phone that dims and locks mid-fight drops the controller. The Wake Lock API needs
  // a secure page (the tunnel's https) and a user gesture, and the lock is released whenever the page is hidden, so take it on
  // every touch and again on return. Unsupported browsers just skip it.
  let wake = null;
  async function keepAwake() { try { if (!wake && navigator.wakeLock && document.visibilityState === 'visible') { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch { wake = null; } }
  document.addEventListener('pointerdown', keepAwake, true);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
})();
</script>
</body>
</html>
